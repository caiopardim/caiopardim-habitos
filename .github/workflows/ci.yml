name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Testes de regras + cobertura mínima
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Nenhum segredo no código do navegador
        run: |
          if grep -rlE "SUPABASE_SERVICE_ROLE|VAPID_PRIVATE|CRON_SECRET|service_role" .next/static; then
            echo "::error::Segredo encontrado no bundle do navegador"; exit 1
          fi
      - name: Navegador para os testes de ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (Playwright)
        run: npm run test:e2e
        env:
          CI: true
      - name: Relatório dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Deploy de produção só depois de tudo passar (opcional: precisa dos segredos da Vercel).
  deploy:
    name: Deploy (Vercel)
    needs: qualidade
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Segredos configurados?
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Sem VERCEL_TOKEN: deploy pela integração da Vercel (veja o README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Build e deploy
        if: steps.check.outputs.ok == 'true'
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
